name: Update IOC domains

on:
  schedule:
    # Once per day at 07:30 UTC (~11:00 Iran time), after AFTA's usual morning refresh
    - cron: "30 7 * * *"
  workflow_dispatch:

concurrency:
  group: update-ioc-domains
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Fetch latest AFTA domain list
        run: bash scripts/update_domains.sh

      - name: Commit and push if changed
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Stage first so newly created (previously untracked) data files are detected
          git add data/AFTA_IOC_DOMAINs.txt data/metadata.json

          if git diff --cached --quiet; then
            echo "No update — list unchanged."
            exit 0
          fi

          LIST_DATE="$(python3 -c 'import json; print(json.load(open("data/metadata.json"))["list_date"])')"
          git commit -m "Update IOC domain list (${LIST_DATE})"
          git push
          echo "Committed and pushed update for ${LIST_DATE}."
